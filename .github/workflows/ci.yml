name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow contracts and installer
        run: bash tests/contract-test.sh
